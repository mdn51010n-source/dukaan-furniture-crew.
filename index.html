<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dukaan Furniture Crew</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5}
  header{background:#8b4513;color:#fff;padding:16px;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
  .card{background:#fff;border-radius:10px;padding:10px;text-align:center;box-shadow:0 1px 4px #0002}
  .card img{width:100%;height:120px;object-fit:cover;border-radius:8px;background:#ddd}
  .price{color:#8b4513;font-weight:bold;margin:6px 0}
  .btn{display:block;background:#25d366;color:#fff;text-decoration:none;padding:8px;border-radius:6px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>Dukaan Furniture Crew</h1>
  <p>Quality furniture, best price</p>
</header>

<div class="grid">
  <div class="card">
    <img src="https://via.placeholder.com/300x200?text=Sofa" alt="Sofa">
    <h3>Sofa Set</h3>
    <div class="price">₹25,000</div>
    <a class="btn" href="https://wa.me/91 76765 44562?text=Mujhe Sofa Set chahiye">WhatsApp pe order karo</a>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300x200?text=Bed" alt="Bed">
    <h3>Double Bed</h3>
    <div class="price">₹18,000</div>
    <a class="btn" href="https://wa.me/91 76765 44562?text=Mujhe Double Bed chahiye">WhatsApp pe order karo</a>
  </div>
</div>
</body>
</html>
